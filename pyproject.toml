[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nifty-technical-analysis"
version = "1.0.0"
description = "Algorithmic Technical Analysis and Buy/Sell Signal Generation Engine for Nifty 50, Bank Nifty, and Indian Equities."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "kalakriticreations0925-source" }
]
keywords = [
    "trading",
    "technical-analysis",
    "nifty",
    "banknifty",
    "nse",
    "supertrend",
    "rsi",
    "macd",
    "bollinger-bands",
    "backtesting",
    "algorithmic-trading",
    "stock-market"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "yfinance>=0.2.35",
    "requests>=2.31.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "matplotlib>=3.7.0"
]

[project.scripts]
nifty-signals = "src.cli:main"
